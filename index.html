<!doctype html>
<html lang="fr-CA" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2A33">
<meta name="google" content="notranslate">
<title>Mission Écran</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFF7EF; --card:#FFFFFF; --ink:#1F2A33; --muted:#6B7280; --line:#EADFD3;
  --accent:#F26A1B; --accent-ink:#FFFFFF; --accent-soft:#FFE6D5;
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7;
  --bad:#B91C1C; --bad-soft:#FEE2E2; --head:#1F2A33; --head-ink:#FFFFFF;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
header.top{background:var(--head);color:var(--head-ink);padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:.2px}
header.top .sub{font-size:13px;opacity:.75}
header.top button{color:var(--head-ink);opacity:.85;font-size:14px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.08)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;text-align:center;padding:6px 12px}
h2{font-size:18px;margin:22px 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;min-height:48px}
.btn.big{width:100%;font-size:19px;padding:18px;min-height:64px;border-radius:20px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.pending{background:var(--warn-soft);color:var(--warn)}
.badge.approved{background:var(--ok-soft);color:var(--ok)}
.badge.rejected{background:var(--bad-soft);color:var(--bad)}
.badge.none{background:#EEF0F2;color:var(--muted)}

/* Choix du profil */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:8px}
.who button{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:20px;font-weight:700}
.who .av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px}
.parent-link{display:block;margin:28px auto 0;color:var(--muted);font-size:15px;padding:12px}

/* Écran enfant */
.hello{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.hello .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:36px;flex:none}
.hello h2{margin:0;font-size:24px}
.progress{height:14px;background:#EFE5DA;border-radius:999px;overflow:hidden;margin:14px 0 6px}
.progress>i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.task{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px}
.task .em{font-size:34px;width:48px;text-align:center;flex:none}
.task .t{font-size:18px;font-weight:700}
.task.done{border-color:#BBE5C8;background:#F4FBF6}
.task.redo{border-color:#F5B7B7;background:#FFF6F6}
.task .note{color:var(--bad);font-size:14px;margin-top:2px}
.task .thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.cam{background:var(--accent);color:#fff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:16px;flex:none;min-height:52px}
.cam.again{padding:12px;min-width:52px;background:transparent;color:var(--muted);border:1.5px solid var(--line);font-size:14px}
.status{border-radius:24px;padding:22px;text-align:center}
.status .ico{font-size:56px;line-height:1}
.status h3{font-size:22px;margin:10px 0 4px}
.status.pending{background:var(--warn-soft);color:#7C4A03}
.status.approved{background:var(--ok-soft);color:#14532D}
.status.rejected{background:var(--bad-soft);color:#7F1D1D}
.status.done{background:var(--accent-soft)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Parent */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.tabs button{padding:10px 14px;border-radius:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.kid-head{display:flex;align-items:center;gap:10px}
.kid-head .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.proofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.proof{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#FAF7F3}
.proof .img{aspect-ratio:1/1;background:#EEE6DC center/cover no-repeat;display:block;width:100%}
.proof .cap{padding:8px 10px;font-size:14px}
.proof .cap b{display:block}
.proof.redo{outline:2px solid var(--bad)}
.mins{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.list>*{border-top:1px solid var(--line);padding:12px 0}
.list>*:first-child{border-top:0}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;cursor:pointer;background:var(--card)}
.days input{display:none}
.days input:checked+span{color:#fff}
.days label:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;min-height:48px}
.off{opacity:.45}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
dialog{border:0;border-radius:20px;padding:20px;max-width:min(92vw,520px);width:100%}
dialog::backdrop{background:rgba(15,20,25,.55)}
dialog.photo{padding:0;background:#000;max-width:96vw}
dialog.photo img{display:block;max-width:96vw;max-height:86vh;margin:auto}
.loading{text-align:center;padding:48px 0;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span></div></div>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<dialog id="dlg"></dialog>
<script>
"use strict";
const CFG = window.APP_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY;
const PARENT_LABEL = CFG.PARENT_LABEL || "papa ou maman";
const DAY_LETTERS = ["D","L","M","M","J","V","S"];
const DAY_NAMES = ["dim","lun","mar","mer","jeu","ven","sam"];
const EMOJIS_KID = ["🦊","🐼","🦁","🐸","🐨","🦄","🐯","🐙","🚀","⚽","🎨","🦖"];
const COLORS = ["#FFD8BF","#D6E9FF","#DDF5D9","#F3DBFF","#FFF0B3","#FFD6E0"];

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };
const dow = () => new Date().getDay();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2));
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString("fr-CA", {hour:"2-digit", minute:"2-digit"}) : "";
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("fr-CA", {weekday:"long", day:"numeric", month:"long"});
const storeGet = (k, f = null) => { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } };
const storeSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

function tasksForDay(tasks, childId, d = today()) {
  const w = new Date(d + "T12:00:00").getDay();
  return tasks.filter(t => t.child_id === childId && t.active &&
    (t.one_off_date ? t.one_off_date === d : (t.days || []).includes(w)));
}

/* ---------- Photos : compression avant envoi ---------- */
async function compress(file, max = 1280, q = 0.72) {
  let img;
  try { img = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch {
    img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  }
  const w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", q));
}
const blobToDataUrl = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

/* ---------- Stockage : Supabase ---------- */
function supaStore() {
  const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const ok = ({data, error}) => { if (error) throw error; return data; };
  const save = async (table, obj) => {
    const {id, ...rest} = obj;
    return id ? ok(await sb.from(table).update(rest).eq("id", id).select().single())
              : ok(await sb.from(table).insert(rest).select().single());
  };
  const urlCache = new Map();
  return {
    async session() { const {data} = await sb.auth.getSession(); return data.session; },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({email, password})); },
    async role() { const {data, error} = await sb.rpc("my_role"); if (error) throw error; return data; },
    async signOut() { await sb.auth.signOut(); },
    async children() { return ok(await sb.from("children").select("*").order("sort").order("created_at")); },
    saveChild: c => save("children", c),
    async deleteChild(id) { ok(await sb.from("children").delete().eq("id", id)); },
    async tasks() { return ok(await sb.from("tasks").select("*").order("sort").order("created_at")); },
    saveTask: t => save("tasks", t),
    async deleteTask(id) { ok(await sb.from("tasks").delete().eq("id", id)); },
    async completions(day, childId) {
      let q = sb.from("completions").select("*").eq("day", day);
      if (childId) q = q.eq("child_id", childId);
      return ok(await q);
    },
    async submitProof(childId, taskId, day, blob) {
      const path = `${childId}/${day}/${taskId}-${Date.now()}.jpg`;
      ok(await sb.storage.from("preuves").upload(path, blob, {contentType: "image/jpeg", upsert: false}));
      return ok(await sb.from("completions")
        .upsert({child_id: childId, task_id: taskId, day, photo_path: path, status: "done", parent_note: null}, {onConflict: "task_id,day"})
        .select().single());
    },
    async setCompletion(id, patch) { ok(await sb.from("completions").update(patch).eq("id", id)); },
    async photoUrl(c) {
      if (urlCache.has(c.photo_path)) return urlCache.get(c.photo_path);
      const {data, error} = await sb.storage.from("preuves").createSignedUrl(c.photo_path, 3600);
      if (error) throw error;
      urlCache.set(c.photo_path, data.signedUrl); return data.signedUrl;
    },
    async latestRequest(childId, day) {
      const r = ok(await sb.from("requests").select("*").eq("child_id", childId).eq("day", day).order("created_at", {ascending: false}).limit(1));
      return r[0] || null;
    },
    async createRequest(childId, day) { return ok(await sb.from("requests").insert({child_id: childId, day}).select().single()); },
    async decide(id, patch) { ok(await sb.from("requests").update({...patch, decided_at: new Date().toISOString()}).eq("id", id)); },
    async requests(sinceDay) { return ok(await sb.from("requests").select("*").gte("day", sinceDay).order("created_at", {ascending: false})); },
  };
}

/* ---------- Stockage : mode démo (sur l'appareil) ---------- */
function demoStore() {
  const KEY = "mission-ecran-demo";
  let db = storeGet(KEY);
  if (!db) {
    const a = uid(), b = uid();
    db = {
      children: [
        {id: a, name: "Léa", emoji: "🦊", color: COLORS[0], default_minutes: 60, sort: 0},
        {id: b, name: "Noah", emoji: "🚀", color: COLORS[1], default_minutes: 45, sort: 1}],
      tasks: [
        {id: uid(), child_id: a, title: "Vider ma boîte à lunch", emoji: "🍱", days: [1,2,3,4,5], one_off_date: null, active: true, sort: 0},
        {id: uid(), child_id: a, title: "Faire mes devoirs", emoji: "📚", days: [1,2,3,4], one_off_date: null, active: true, sort: 1},
        {id: uid(), child_id: a, title: "Ranger ma chambre", emoji: "🧸", days: [3,5], one_off_date: null, active: true, sort: 2},
        {id: uid(), child_id: b, title: "Accrocher mon manteau", emoji: "🧥", days: [1,2,3,4,5], one_off_date: null, active: true, sort: 0},
        {id: uid(), child_id: b, title: "Lire 15 minutes", emoji: "📖", days: [1,2,3,4,5], one_off_date: null, active: true, sort: 1}],
      completions: [], requests: []
    };
    storeSet(KEY, db);
  }
  const persist = () => {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch { db.completions = db.completions.filter(c => c.day === today()); localStorage.setItem(KEY, JSON.stringify(db)); }
  };
  const upsert = (list, obj) => {
    if (obj.id) { const i = db[list].findIndex(x => x.id === obj.id); db[list][i] = {...db[list][i], ...obj}; persist(); return db[list][i]; }
    const n = {...obj, id: uid(), created_at: new Date().toISOString()}; db[list].push(n); persist(); return n;
  };
  const clone = x => JSON.parse(JSON.stringify(x));
  return {
    async session() { return storeGet("mission-ecran-demo-parent") ? {demo: true} : null; },
    async signIn() { storeSet("mission-ecran-demo-parent", true); },
    async role() { return "parent"; },
    async signOut() { localStorage.removeItem("mission-ecran-demo-parent"); },
    async children() { return clone(db.children).sort((x, y) => x.sort - y.sort); },
    async saveChild(c) { return upsert("children", c); },
    async deleteChild(id) { db.children = db.children.filter(c => c.id !== id); db.tasks = db.tasks.filter(t => t.child_id !== id); persist(); },
    async tasks() { return clone(db.tasks).sort((x, y) => x.sort - y.sort); },
    async saveTask(t) { return upsert("tasks", t); },
    async deleteTask(id) { db.tasks = db.tasks.filter(t => t.id !== id); persist(); },
    async completions(day, childId) { return clone(db.completions.filter(c => c.day === day && (!childId || c.child_id === childId))); },
    async submitProof(childId, taskId, day, blob) {
      const small = await compress(blob, 720, 0.6);
      const data = await blobToDataUrl(small);
      db.completions = db.completions.filter(c => !(c.task_id === taskId && c.day === day));
      const n = {id: uid(), child_id: childId, task_id: taskId, day, photo_path: "demo", photo_data: data, status: "done", parent_note: null, created_at: new Date().toISOString()};
      db.completions.push(n); persist(); return n;
    },
    async setCompletion(id, patch) { const c = db.completions.find(x => x.id === id); Object.assign(c, patch); persist(); },
    async photoUrl(c) { return c.photo_data; },
    async latestRequest(childId, day) {
      const r = db.requests.filter(x => x.child_id === childId && x.day === day).sort((a, b) => b.created_at.localeCompare(a.created_at));
      return r[0] ? clone(r[0]) : null;
    },
    async createRequest(childId, day) { return upsert("requests", {child_id: childId, day, status: "pending", minutes: null, parent_note: null, decided_at: null}); },
    async decide(id, patch) { upsert("requests", {id, ...patch, decided_at: new Date().toISOString()}); },
    async requests(sinceDay) { return clone(db.requests.filter(r => r.day >= sinceDay)).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
  };
}

const store = DEMO ? demoStore() : supaStore();

/* ---------- Petite boîte de dialogue ---------- */
const dlg = $("#dlg");
function ask({title, text = "", placeholder = "", value = "", okLabel = "OK", cancel = true}) {
  return new Promise(resolve => {
    dlg.className = "";
    dlg.innerHTML = `<form method="dialog" class="stack">
      <h3 style="margin:0">${esc(title)}</h3>
      ${text ? `<div class="muted">${esc(text)}</div>` : ""}
      ${placeholder !== null ? `<input class="field" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);min-height:48px" name="v" placeholder="${esc(placeholder)}" value="${esc(value)}">` : ""}
      <div class="row" style="justify-content:flex-end">
        ${cancel ? `<button class="btn ghost" value="cancel">Annuler</button>` : ""}
        <button class="btn" value="ok">${esc(okLabel)}</button>
      </div></form>`;
    dlg.onclose = () => resolve(dlg.returnValue === "ok" ? (dlg.querySelector("[name=v]")?.value ?? true) : null);
    dlg.showModal();
    dlg.querySelector("[name=v]")?.focus();
  });
}
function showPhoto(src) {
  dlg.className = "photo";
  dlg.innerHTML = `<img src="${esc(src)}" alt="Preuve">`;
  dlg.onclose = null;
  dlg.onclick = () => { dlg.close(); dlg.onclick = null; };
  dlg.showModal();
}

/* ---------- Routeur ---------- */
const app = $("#app");
let timer = null;
let myRole = undefined;
function setTimer(fn, ms) { clearInterval(timer); timer = fn ? setInterval(fn, ms) : null; }

async function route() {
  setTimer(null);
  const h = location.hash.replace(/^#\/?/, "");
  const [view, id] = h.split("/");
  try {
    if (!DEMO) {
      const session = await store.session();
      if (!session) return loginView();
      if (myRole === undefined) myRole = await store.role();
      if (!myRole) return notMemberView();
    }
    if (view === "enfant" && id) return await kidView(id);
    if (view === "parent") return await parentView();
    return await homeView();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="wrap"><div class="err">Oups, problème de connexion : ${esc(e.message || e)}</div>
      <p><button class="btn ghost" onclick="route()">Réessayer</button></p></div>`;
  }
}
window.addEventListener("hashchange", route);

function shell(title, sub, right, body) {
  return `${DEMO ? `<div class="demo">Mode démo — les données restent sur cet appareil. Configure config.js pour le vrai mode.</div>` : ""}
    <header class="top"><div class="in"><div class="grow"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${right || ""}</div></header>
    <div class="wrap">${body}</div>`;
}

/* ---------- Accueil : qui es-tu ? ---------- */
async function homeView() {
  const remembered = storeGet("mission-ecran-me");
  const kids = await store.children();
  if (remembered && kids.some(k => k.id === remembered) && !sessionStorage.getItem("choose")) {
    location.replace("#/enfant/" + remembered); return;
  }
  app.innerHTML = shell("Mission Écran", fmtDay(today()), "", `
    <h2 style="font-size:24px;text-align:center;margin-top:18px">Qui es-tu ?</h2>
    ${kids.length ? `<div class="who">${kids.map(k => `
      <button data-kid="${k.id}"><span class="av" style="background:${esc(k.color)}">${esc(k.emoji)}</span>${esc(k.name)}</button>`).join("")}</div>`
      : `<div class="card muted" style="text-align:center">Aucun enfant pour l'instant. Un parent doit les ajouter dans l'espace parent.</div>`}
    <a class="parent-link" href="#/parent" style="text-align:center">🔒 Espace parent</a>`);
  app.querySelectorAll("[data-kid]").forEach(b => b.onclick = () => {
    storeSet("mission-ecran-me", b.dataset.kid); sessionStorage.removeItem("choose");
    location.hash = "#/enfant/" + b.dataset.kid;
  });
}

/* ---------- Écran enfant ---------- */
let pendingTask = null;
const localThumbs = new Map();

async function kidView(childId) {
  const [kids, allTasks] = await Promise.all([store.children(), store.tasks()]);
  const child = kids.find(k => k.id === childId);
  if (!child) { localStorage.removeItem("mission-ecran-me"); location.replace("#/"); return; }
  const d = today();
  const tasks = tasksForDay(allTasks, childId, d);

  const draw = async () => {
    const [comps, req] = await Promise.all([store.completions(d, childId), store.latestRequest(childId, d)]);
    const byTask = new Map(comps.map(c => [c.task_id, c]));
    const doneCount = tasks.filter(t => byTask.get(t.id)?.status === "done").length;
    const allDone = doneCount === tasks.length;
    const locked = req && (req.status === "pending" || req.status === "approved");
    const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 100;

    let status = "";
    if (req?.status === "pending") {
      status = `<div class="status pending"><div class="ico">⏳</div><h3>C'est envoyé !</h3>
        <div><span class="spin"></span>&nbsp; ${esc(PARENT_LABEL)} regarde tes photos…</div></div>`;
    } else if (req?.status === "approved") {
      status = `<div class="status approved"><div class="ico">🎉</div><h3>Bravo ${esc(child.name)} !</h3>
        ${req.parent_note ? `<div style="font-size:20px;margin:6px 0">« ${esc(req.parent_note)} »</div>` : ""}
        <div>${req.minutes > 0 ? `<b>${req.minutes} minutes</b> de temps d'écran accordées.` : "Tes tâches sont validées."}</div></div>`;
    } else if (req?.status === "rejected" && !allDone) {
      status = `<div class="status rejected"><div class="ico">🔁</div><h3>Presque !</h3>
        <div>${req.parent_note ? esc(req.parent_note) : "Certaines tâches sont à refaire."}</div></div>`;
    } else if (allDone) {
      status = `<div class="status done"><div class="ico">${tasks.length ? "🏁" : "😎"}</div>
        <h3>${tasks.length ? "Tout est fait !" : "Pas de tâches aujourd'hui"}</h3>
        <p class="muted" style="margin:4px 0 14px">${req?.status === "rejected" ? `Tes tâches sont refaites. Avise ${esc(PARENT_LABEL)} de nouveau.` : `Avise ${esc(PARENT_LABEL)} pour faire vérifier tes photos.`}</p>
        <button class="btn big" id="ask">📣 J'ai fini ! Aviser ${esc(PARENT_LABEL)}</button></div>`;
    }

    app.innerHTML = shell("Mission Écran", fmtDay(d), `<button id="switch">Changer</button>`, `
      <div class="hello"><span class="av" style="background:${esc(child.color)}">${esc(child.emoji)}</span>
        <div><h2>Salut ${esc(child.name)} !</h2><div class="muted">${tasks.length ? `${doneCount} sur ${tasks.length} tâche${tasks.length > 1 ? "s" : ""}` : "Journée libre"}</div></div></div>
      ${tasks.length ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ""}
      ${status ? `<div style="margin:16px 0">${status}</div>` : ""}
      <div class="stack" style="margin-top:16px">${tasks.map(t => {
        const c = byTask.get(t.id);
        const st = c?.status === "done" ? "done" : c?.status === "redo" ? "redo" : "";
        const thumb = localThumbs.get(t.id + d);
        return `<div class="task ${st}">
          <div class="em">${st === "done" ? "✅" : esc(t.emoji)}</div>
          <div class="grow"><div class="t">${esc(t.title)}</div>
            ${st === "done" ? `<div class="small muted">Photo envoyée ${fmtTime(c.created_at)}</div>` : ""}
            ${st === "redo" ? `<div class="note">À refaire${c.parent_note ? " : " + esc(c.parent_note) : ""}</div>` : ""}
          </div>
          ${thumb && st === "done" ? `<img class="thumb" src="${thumb}" alt="">` : ""}
          ${locked ? "" : `<button class="cam ${st === "done" ? "again" : ""}" data-task="${t.id}">${st === "done" ? "🔄" : "📸 Photo"}</button>`}
        </div>`;
      }).join("")}</div>`);

    $("#switch").onclick = () => { sessionStorage.setItem("choose", "1"); location.hash = "#/"; };
    app.querySelectorAll("[data-task]").forEach(b => b.onclick = () => { pendingTask = b.dataset.task; $("#camera").value = ""; $("#camera").click(); });
    const askBtn = $("#ask");
    if (askBtn) askBtn.onclick = async () => {
      askBtn.disabled = true; askBtn.innerHTML = `<span class="spin"></span> Envoi…`;
      try { await store.createRequest(childId, d); toast("C'est envoyé !"); }
      catch (e) { toast("Erreur : " + (e.message || e)); }
      draw();
    };
    setTimer(req?.status === "pending" ? draw : null, 8000);
  };

  $("#camera").onchange = async e => {
    const file = e.target.files?.[0]; if (!file || !pendingTask) return;
    const taskId = pendingTask; pendingTask = null;
    const btn = app.querySelector(`[data-task="${taskId}"]`);
    if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span>`; }
    try {
      const blob = await compress(file);
      localThumbs.set(taskId + d, URL.createObjectURL(blob));
      await store.submitProof(childId, taskId, d, blob);
      toast("Photo envoyée ✅");
    } catch (err) { console.error(err); toast("L'envoi n'a pas marché, réessaie. " + (err.message || "")); }
    draw();
  };
  await draw();
}

let parentTab = "demandes";
let taskKid = null;

async function parentView() {
  if (DEMO) await store.signIn();
  else if (myRole !== "parent") return deviceOnlyView();
  const kids = await store.children();
  const tabs = [["demandes", "Demandes"], ["taches", "Tâches"], ["enfants", "Enfants"], ["historique", "Historique"]];
  app.innerHTML = shell("Espace parent", fmtDay(today()), `<button id="home">Accueil</button>${DEMO ? "" : `<button id="out">Quitter</button>`}`, `

    <div id="pane"></div>`);
  $("#home").onclick = () => { sessionStorage.setItem("choose", "1"); location.hash = "#/"; };
  $("#out")?.addEventListener("click", async () => { await store.signOut(); myRole = undefined; location.hash = "#/"; route(); });
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { parentTab = b.dataset.tab; parentView(); });

}

async function paneRequests(pane, kids) {
  const d = today();
  const [allTasks, comps, reqs] = await Promise.all([store.tasks(), store.completions(d), store.requests(d)]);
  const latest = new Map();
  reqs.forEach(r => { if (!latest.has(r.child_id)) latest.set(r.child_id, r); });
  const order = {pending: 0, undefined: 1, rejected: 2, approved: 3};
  const sorted = [...kids].sort((a, b) => order[latest.get(a.id)?.status] - order[latest.get(b.id)?.status]);
  if (!kids.length) { pane.innerHTML = `<div class="card muted" style="margin-top:16px">Ajoute d'abord tes enfants dans l'onglet Enfants.</div>`; return; }

  pane.innerHTML = `<div class="stack" style="margin-top:14px">${sorted.map(k => {
    const tasks = tasksForDay(allTasks, k.id, d);
    const kc = comps.filter(c => c.child_id === k.id);
    const done = tasks.filter(t => kc.find(c => c.task_id === t.id && c.status === "done")).length;
    const r = latest.get(k.id);
    const label = r ? {pending: "À valider", approved: r.minutes > 0 ? `Validé · ${r.minutes} min` : "Validé", rejected: "À revoir"}[r.status] : "Pas encore avisé";
    return `<div class="card" data-kidcard="${k.id}">
      <div class="kid-head"><span class="av" style="background:${esc(k.color)}">${esc(k.emoji)}</span>
        <div class="grow"><b>${esc(k.name)}</b><div class="small muted">${done}/${tasks.length} tâches faites</div></div>
        <span class="badge ${r ? r.status : "none"}">${label}</span></div>
      ${kc.length ? `<div class="proofs">${tasks.filter(t => kc.find(c => c.task_id === t.id)).map(t => {
        const c = kc.find(x => x.task_id === t.id);
        return `<div class="proof ${c.status === "redo" ? "redo" : ""}">
          <button class="img" data-photo="${c.id}" aria-label="Voir la photo"></button>
          <div class="cap"><b>${esc(t.emoji)} ${esc(t.title)}</b>
            <span class="small muted">${fmtTime(c.created_at)}${c.status === "redo" ? " · à refaire" : ""}</span>
            ${c.status === "done" && r?.status !== "approved" ? `<div style="margin-top:6px"><button class="btn ghost sm" data-redo="${c.id}">À refaire</button></div>` : ""}
          </div></div>`;
      }).join("")}</div>` : ""}
      ${r?.status === "pending" ? `
        <div class="small muted" style="margin-top:14px">Temps d'écran</div>
        <div class="mins" style="margin-top:6px">${[...new Set([0, 30, 45, 60, 90, 120, k.default_minutes ?? 60])].sort((x, y) => x - y).map(m => `<button class="chip ${m === (k.default_minutes ?? 60) ? "on" : ""}" data-min="${m}">${m ? m + " min" : "Aucun"}</button>`).join("")}</div>
        <label class="field" style="margin-bottom:12px"><span>Petit mot pour ${esc(k.name)}</span>
          <input data-note placeholder="Beau travail ! 😊" maxlength="140"></label>
        <div class="row">
          <button class="btn ok grow" data-approve="${r.id}">✅ Valider</button>
          <button class="btn bad" data-reject="${r.id}">À revoir</button>
        </div>` : ""}
      ${r?.status === "approved" && r.parent_note ? `<div class="small muted" style="margin-top:10px">Ton mot : « ${esc(r.parent_note)} »</div>` : ""}
      ${r?.status === "approved" && r.minutes > 0 ? `<div class="row" style="margin-top:12px">
        <a class="btn ghost sm" href="intent://#Intent;package=com.google.android.apps.kids.familylink;end">Ouvrir Family Link</a>
        <span class="small muted">Accorde ${r.minutes} min à ${esc(k.name)} dans Family Link.</span></div>` : ""}
    </div>`;
  }).join("")}</div>`;

  // photos (chargement différé)
  pane.querySelectorAll("[data-photo]").forEach(async el => {
    const c = comps.find(x => x.id === el.dataset.photo);
    try { const u = await store.photoUrl(c); el.style.backgroundImage = `url("${u}")`; el.onclick = () => showPhoto(u); }
    catch { el.textContent = "Photo introuvable"; }
  });
  pane.querySelectorAll("[data-min]").forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); b.classList.add("on");
  });
  pane.querySelectorAll("[data-redo]").forEach(b => b.onclick = async () => {
    const note = await ask({title: "Tâche à refaire", text: "Un mot pour expliquer (facultatif)", placeholder: "Ex. : il reste des jouets sous le lit"});
    if (note === null) return;
    await store.setCompletion(b.dataset.redo, {status: "redo", parent_note: note || null});
    const card = b.closest("[data-kidcard]"); const r = latest.get(card.dataset.kidcard);
    if (r?.status === "pending") await store.decide(r.id, {status: "rejected", parent_note: note || "Une tâche est à refaire."});
    toast("Envoyé à l'enfant"); paneRequests(pane, kids);
  });
  pane.querySelectorAll("[data-approve]").forEach(b => b.onclick = async () => {
    const card = b.closest("[data-kidcard]");
    const minutes = +(card.querySelector(".chip.on")?.dataset.min ?? 0);
    const note = card.querySelector("[data-note]").value.trim() || "Beau travail ! 😊";
    b.disabled = true;
    await store.decide(b.dataset.approve, {status: "approved", minutes, parent_note: note});
    toast(minutes > 0 ? `Validé : ${minutes} min. Accorde-les dans Family Link.` : "Validé, sans temps d'écran.", 4000);
    paneRequests(pane, kids);
  });
  pane.querySelectorAll("[data-reject]").forEach(b => b.onclick = async () => {
    const note = await ask({title: "À revoir", text: "Qu'est-ce qui manque ?", placeholder: "Ex. : refais la photo de ta chambre"});
    if (note === null) return;
    await store.decide(b.dataset.reject, {status: "rejected", parent_note: note || null});
    toast("Envoyé à l'enfant"); paneRequests(pane, kids);
  });
}

async function paneTasks(pane, kids) {
  if (!kids.length) { pane.innerHTML = `<div class="card muted" style="margin-top:16px">Ajoute d'abord tes enfants dans l'onglet Enfants.</div>`; return; }
  if (!taskKid || !kids.some(k => k.id === taskKid)) taskKid = kids[0].id;
  const all = await store.tasks();
  const tasks = all.filter(t => t.child_id === taskKid);
  const k = kids.find(x => x.id === taskKid);
  const d = today();
  const describe = t => t.one_off_date ? (t.one_off_date === d ? "Aujourd'hui seulement" : "Le " + fmtDay(t.one_off_date))
    : (t.days?.length === 7 ? "Tous les jours" : (t.days || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(x => DAY_NAMES[x]).join(", ") || "Aucun jour");
  const order = [1, 2, 3, 4, 5, 6, 0];
  pane.innerHTML = `
    <div class="row" style="margin-top:14px">${kids.map(x => `<button class="chip ${x.id === taskKid ? "on" : ""}" data-pick="${x.id}">${esc(x.emoji)} ${esc(x.name)}</button>`).join("")}</div>
    <h2>Tâches de ${esc(k.name)}</h2>
    <div class="card list">${tasks.length ? tasks.map(t => `
      <div class="row ${t.active ? "" : "off"}">
        <span style="font-size:26px">${esc(t.emoji)}</span>
        <div class="grow"><b>${esc(t.title)}</b><div class="small muted">${describe(t)}</div></div>
        <button class="btn ghost sm" data-toggle="${t.id}">${t.active ? "Pause" : "Activer"}</button>
        <button class="btn ghost sm" data-del="${t.id}" aria-label="Supprimer">🗑</button>
      </div>`).join("") : `<div class="muted">Aucune tâche.</div>`}</div>

    <h2>Ajouter une tâche</h2>
    <form id="addTask" class="card stack">
      <div class="row">
        <label class="field" style="width:80px"><span>Icône</span><input name="emoji" value="✅" maxlength="4" style="text-align:center;font-size:22px"></label>
        <label class="field grow"><span>Tâche</span><input name="title" required placeholder="Ex. : Vider ma boîte à lunch"></label>
      </div>
      <div class="row">
        <label class="chip"><input type="radio" name="mode" value="rec" checked> Jours récurrents</label>
        <label class="chip"><input type="radio" name="mode" value="once"> Une seule date</label>
      </div>
      <div id="recBox" class="days">${order.map(i => `<label><input type="checkbox" name="d" value="${i}" ${i >= 1 && i <= 5 ? "checked" : ""}><span>${DAY_LETTERS[i]}</span></label>`).join("")}</div>
      <label id="onceBox" class="field" hidden><span>Date</span><input type="date" name="date" value="${d}"></label>
      <button class="btn">Ajouter pour ${esc(k.name)}</button>
    </form>`;
  pane.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { taskKid = b.dataset.pick; paneTasks(pane, kids); });
  pane.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
    const t = tasks.find(x => x.id === b.dataset.toggle); await store.saveTask({id: t.id, active: !t.active}); paneTasks(pane, kids);
  });
  pane.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const t = tasks.find(x => x.id === b.dataset.del);
    if (await ask({title: "Supprimer cette tâche ?", text: t.title, placeholder: null, okLabel: "Supprimer"}) === null) return;
    await store.deleteTask(t.id); paneTasks(pane, kids);
  });
  const f = $("#addTask");
  f.querySelectorAll("[name=mode]").forEach(r => r.onchange = () => {
    const once = f.mode.value === "once"; $("#recBox").hidden = once; $("#onceBox").hidden = !once;
  });
  f.onsubmit = async e => {
    e.preventDefault();
    const once = f.mode.value === "once";
    const days = [...f.querySelectorAll("[name=d]:checked")].map(x => +x.value);
    if (!once && !days.length) return toast("Choisis au moins un jour");
    await store.saveTask({child_id: taskKid, title: f.title.value.trim(), emoji: f.emoji.value.trim() || "✅",
      days: once ? [] : days, one_off_date: once ? f.date.value : null, active: true, sort: tasks.length});
    toast("Tâche ajoutée"); paneTasks(pane, kids);
  };
}

async function paneKids(pane, kids) {

  });

    const k = kids.find(x => x.id === b.dataset.rm);
    if (await ask({title: `Retirer ${k.name} ?`, text: "Ses tâches et son historique seront supprimés.", placeholder: null, okLabel: "Retirer"}) === null) return;
    await store.deleteChild(k.id); parentView();
  });
  f.onsubmit = async e => {
    e.preventDefault();
    const obj = {name: f.name.value.trim(), emoji: f.emoji.value, default_minutes: f.min.value === "" ? 60 : Math.max(0, +f.min.value)};
    if (f.id.value) obj.id = f.id.value;
    else { obj.color = COLORS[kids.length % COLORS.length]; obj.sort = kids.length; }
    await store.saveChild(obj); toast("Enregistré"); parentView();
  };
}

async function paneHistory(pane, kids) {
  const reqs = await store.requests(dayOffset(-14));
  const name = id => { const k = kids.find(x => x.id === id); return k ? `${k.emoji} ${k.name}` : "?"; };
  const byDay = {};
  reqs.forEach(r => (byDay[r.day] ||= []).push(r));
  const totals = {};
  reqs.filter(r => r.status === "approved").forEach(r => totals[r.child_id] = (totals[r.child_id] || 0) + (r.minutes || 0));
  pane.innerHTML = `
    <h2>14 derniers jours</h2>
    ${kids.length ? `<div class="row">${kids.map(k => `<span class="chip">${esc(k.emoji)} ${esc(k.name)} · <b>${totals[k.id] || 0} min</b></span>`).join("")}</div>` : ""}
    <div class="stack" style="margin-top:14px">${Object.keys(byDay).length ? Object.entries(byDay).map(([day, rs]) => `
      <div class="card"><b style="text-transform:capitalize">${fmtDay(day)}</b>
        <div class="list" style="margin-top:6px">${rs.map(r => `<div class="row">
          <span class="grow">${esc(name(r.child_id))} <span class="small muted">${fmtTime(r.created_at)}</span></span>
          <span class="badge ${r.status}">${{pending: "À valider", approved: r.minutes > 0 ? r.minutes + " min" : "Validé", rejected: "À revoir"}[r.status]}</span></div>
          ${r.parent_note ? `<div class="small muted" style="padding-top:0;border:0">« ${esc(r.parent_note)} »</div>` : ""}`).join("")}</div></div>`).join("")
      : `<div class="card muted">Aucune demande pour l'instant.</div>`}</div>`;
}

/* ---------- Démarrage ---------- */
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
route();
</script>
</body>
</html>
